services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jigo
      POSTGRES_PASSWORD: jigo
      POSTGRES_DB: jigo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jigo -d jigo"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jigo:jigo@postgres:5432/jigo
      JWT_SECRET: dev-only-change-me-not-a-real-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
